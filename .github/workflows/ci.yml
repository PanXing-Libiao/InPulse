# 技术设计 §12.4 CI 门禁顺序（本 job 内按序执行）：
#   1  依赖安装（frozen lockfile）        -> Install dependencies with frozen lockfile
#   2  lint                               -> Lint
#   3  format check                       -> Format check
#   4  typecheck                          -> Typecheck
#   5  unit tests                         -> Unit tests
#   6  database migrations from empty DB  -> Migration file consistency
#                                            + Build PostgreSQL 18.6 + PGroonga test image
#                                            + Start PostgreSQL 18.6 test cluster
#                                            + Bootstrap database roles
#                                            + Bootstrap PGroonga extension
#                                            + Migrate empty database
#   7  integration tests                  -> Install PostgreSQL 18 client tools
#                                            + Integration tests against real PostgreSQL
#                                            （含 §12.4 database role/privilege probes）
#   8  OpenAPI/client drift check         -> OpenAPI and client drift check
#   9  Route Registry/permission/response-schema completeness
#                                         -> Route Registry completeness check
#  10  web/api production build           -> Build
#  11  production container image build   -> Build production {api,migrate,web,db-bootstrap} image
#                                            + Verify web image per-response nonce CSP（F-09）
#  12  image vulnerability scan           -> Scan production images (Trivy)
#  13  Playwright browser E2E             -> Browser E2E（F-31 基座；数据库驱动）
#  14  compose/ref preflight              -> check:deploy:test（合成 ref 正例）
#  15  dependency boundary check          -> Dependency boundary check
#                                            + Frontend boundary check (dependency-cruiser)
#  16  permission matrix test             -> Permission matrix check
#  17  dependency/secret scan             -> Dependency audit / Secret scan
#  18  documentation check                -> Documentation checks
#
# 迁移 0003_search_pgroonga.sql 在缺少 PGroonga 时 fail closed，因此本 job 先用
# database/poc/search-pgroonga/Dockerfile.pgroonga-pg18.6 基于 digest 固定的
# postgres:18.6 构建探针镜像，再按 database/scripts/test-local.ps1 的同一顺序执行
# 000_roles.sql -> 020_pgroonga.sql -> 迁移 -> 集成测试。该探针镜像只用于 CI 与
# PoC，不是生产部署镜像，也不等于 §12.4 的 container image build 门禁；生产镜像
# 与其 digest 仍由部署纵切片按 ADR-017 定案。
#
# A-1 备份/恢复集成测试需要真实 pg_dump/pg_restore：runner 自带的是 PGDG noble 的
# pg_dump 16.x，而 pg_dump 拒绝连接主版本更新的服务器（测试库为 PostgreSQL 18.6）。
# 本 job 因此在集成测试前启用 PGDG 源并安装与生产 ops 镜像同一基线的
# postgresql-client-18=18.6-1.pgdg24.04+2，并向集成测试注入
# INPULSE_BACKUP_PG_DUMP/INPULSE_BACKUP_PG_RESTORE。
#
# `pnpm test:search:db` 与 `pnpm test` 需要已初始化 PGroonga 且
# max_connections >= 150 的 PostgreSQL 18 实例，沿用 origin/main 的既定决定暂不
# 纳入本 workflow；待批准的搜索服务测试方案确定后必须按 §12.4 顺序插入。
#
# §12.4 中尚未落库、因此本 workflow 不执行也不声称通过的项：
#   - Playwright 完整业务关键路径（F-31 测试基座已落库，业务场景待对应模块交付）
#   - 生产镜像 digest 绑定与签名发布清单（部署发布环节，非本 job 输出）
# 生产 Dockerfile（API/Migration/Web/DB-bootstrap/Ops）与镜像扫描已按 §12.4 顺序在本
# workflow 落库；`pnpm check:deploy:test` 继续用合成 ref 验证 Compose 渲染与结构，
# 生产镜像 digest 必须由受信镜像仓库解析并在发布清单中绑定。
#
# 耗时优化（不改变 §12.4 的门禁顺序与内容）：同一 ref 的新推送取消仍在运行的旧
# 流水线，避免连续推送排队跑完多条完整门禁，main 上的运行不取消。2026-09-10 用
# GitHub Actions 实测：单次运行约 16 分钟，而 `pnpm install --frozen-lockfile` 仅
# 约 13 秒，因此不为 pnpm store 引入缓存步骤；主要耗时是 Browser E2E、生产镜像
# 构建与 Trivy 扫描。Trivy 漏洞库已由 trivy-action 自带缓存，不需要重复配置；
# Playwright 浏览器（约 100MB）用 actions/cache 缓存，缓存命中后 Install Playwright browser 由实测 23s 降到 14s（未命中时为 25s~116s）
# 压到只剩系统依赖安装。
# 6 个镜像构建（5 个生产镜像 + PGroonga 探针镜像）改用 container driver 的 buildx 并带 `type=gha` 层缓存，配合
# deploy/docker/*.Dockerfile 中“先复制依赖清单、再复制源码”的层顺序，避免源码
# 改动触发依赖重装；各镜像使用独立 cache scope。
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/*"

permissions:
  contents: read

concurrency:
  # pull_request 事件的 ref 是 refs/pull/<编号>/merge，因此同一 PR 的新推送会取消
  # 该 PR 尚未完成的旧运行；已合并到 main 的运行一律跑完，不留模糊结果。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TZ: Asia/Shanghai
  POSTGRES_IMAGE: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
  PGROONGA_IMAGE: inpulse-ci-pgroonga-pg18.6:local
  POSTGRES_CONTAINER: inpulse-ci-pg

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Enable corepack pnpm
        run: corepack enable

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Migration file consistency
        run: pnpm db:migrations:check

      - name: Set up Docker Buildx with GHA layer cache
        # 跨运行复用镜像层必须用 container driver：默认 docker driver 的 builder
        # 不支持 `--cache-to type=gha`，会直接报错。
        run: |
          docker buildx create --name inpulse-ci --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build PostgreSQL 18.6 + PGroonga test image
        # 基础镜像由 POSTGRES_IMAGE 的 digest 固定；PGroonga 与 libgroonga 的
        # Debian 包版本和 keyring SHA-256 在 Dockerfile 内固定。
        run: |
          docker buildx build \
            --file database/poc/search-pgroonga/Dockerfile.pgroonga-pg18.6 \
            --build-arg POSTGRES_IMAGE="$POSTGRES_IMAGE" \
            --tag "$PGROONGA_IMAGE" \
            --cache-from type=gha,scope=pgroonga \
            --cache-to type=gha,mode=max,scope=pgroonga,ignore-error=true \
            --load \
            database/poc/search-pgroonga

      - name: Start PostgreSQL 18.6 test cluster
        run: |
          docker run -d --name "$POSTGRES_CONTAINER" \
            --env POSTGRES_USER=cluster_bootstrap \
            --env POSTGRES_DB=app \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:5432:5432 \
            "$PGROONGA_IMAGE" \
            -c max_connections=200
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready --host=127.0.0.1 --username=cluster_bootstrap --dbname=app >/dev/null 2>&1; then
              echo "PostgreSQL 18.6 accepts connections."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time." >&2
          docker logs "$POSTGRES_CONTAINER"
          exit 1

      - name: Verify PGroonga is available
        # PGroonga 随探针镜像提供，这里只确认扩展能被 PostgreSQL 18.6 识别，
        # 失败时立即阻断，避免把缺少扩展的环境误判成迁移缺陷。
        run: |
          docker exec "$POSTGRES_CONTAINER" \
            psql -X -At -v ON_ERROR_STOP=1 -U cluster_bootstrap -d app \
            -c "SELECT count(*)::INTEGER FROM pg_available_extensions WHERE name = 'pgroonga'" \
            | grep -qx 1

      - name: Bootstrap database roles
        # 只执行 000_roles.sql：010_passwords.sql 读取 /run/secrets/* 的五个独立
        # 密码文件，属于生产初始化，CI 使用 trust 认证，与 database/scripts/test-local.ps1 一致。
        run: |
          docker exec --interactive "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U cluster_bootstrap -d app \
            < database/bootstrap/000_roles.sql

      - name: Bootstrap PGroonga extension
        # PGroonga 不是 trusted extension，只能由一次性 bootstrap 超级用户安装；
        # 020_pgroonga.sql 同时撤销业务角色的管理函数 EXECUTE，只保留 app_runtime
        # 查询与转义所需函数。必须在 000_roles.sql 之后、迁移之前执行。
        run: |
          docker exec --interactive "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U cluster_bootstrap -d app \
            < database/bootstrap/020_pgroonga.sql

      - name: Migrate empty database
        env:
          NODE_ENV: test
          MIGRATION_DATABASE_URL: postgresql://app_migrator@127.0.0.1:5432/app
        run: pnpm db:migrate

      - name: Install PostgreSQL 18 client tools
        # 集成测试需要真实 pg_dump/pg_restore（A-1 备份/恢复演练），而 runner 自带的
        # PGDG noble 客户端是 16.x：pg_dump 拒绝连接主版本更新的服务器（测试库为
        # PostgreSQL 18.6）。这里启用 PGDG 源并安装与生产 ops 镜像同一基线的 18.6
        # 客户端，再通过 INPULSE_BACKUP_PG_DUMP/INPULSE_BACKUP_PG_RESTORE 注入。
        run: |
          if ! grep -rqs "apt.postgresql.org" /etc/apt/sources.list.d/; then
            if [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            else
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
              . /etc/os-release
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            fi
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18=18.6-1.pgdg24.04+2
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Integration tests against real PostgreSQL
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://cluster_bootstrap@127.0.0.1:5432/app
          INPULSE_BACKUP_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
          INPULSE_BACKUP_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
        run: pnpm test:integration

      - name: OpenAPI and client drift check
        run: pnpm contract:drift

      - name: Route Registry completeness check
        run: pnpm contract:validate

      - name: Build
        run: pnpm build

      - name: Build production API image
        # 生产 API 多阶段镜像：base 固定 node:24.20.0-bookworm-slim digest，
        # runtime 仅含 pnpm deploy --prod 产出的生产依赖，非 root。
        run: |
          docker buildx build \
            --file deploy/docker/api.Dockerfile \
            --tag inpulse/api:ci \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api,ignore-error=true \
            --load \
            .

      - name: Build production migration image
        # 生产 migration/ops 镜像：与 API 同 commit，运行编译后的 migration 入口，
        # 不携带 tsx，使用生产依赖。
        run: |
          docker buildx build \
            --file deploy/docker/migration.Dockerfile \
            --tag inpulse/migrate:ci \
            --cache-from type=gha,scope=migration \
            --cache-to type=gha,mode=max,scope=migration,ignore-error=true \
            --load \
            .

      - name: Build production web image
        # 生产 Web 镜像：builder 执行 Vite build，runtime 使用
        # nginx-unprivileged:1.30.4 digest，托管 dist 并代理 API/health。
        run: |
          docker buildx build \
            --file deploy/docker/web.Dockerfile \
            --tag inpulse/web:ci \
            --cache-from type=gha,scope=web \
            --cache-to type=gha,mode=max,scope=web,ignore-error=true \
            --load \
            .

      - name: Verify web image per-response nonce CSP
        # F-09：用真实构建出的镜像和真实 Nginx 配置验证逐响应 nonce CSP、安全响应头、
        # no-store 与哈希资源不可变（技术设计 §7.5 / ADR-021，测试矩阵 SEC-002）。
        run: bash scripts/check-web-image-csp.sh inpulse/web:ci

      - name: Build production db-bootstrap image
        # 生产 PostgreSQL 18.6 bootstrap 镜像：base 固定 postgres:18.6 digest，
        # 安装评审基线 PGroonga 并放入 bootstrap SQL（不含密码）。
        run: |
          docker buildx build \
            --file deploy/docker/db-bootstrap.Dockerfile \
            --tag inpulse/db-bootstrap:ci \
            --cache-from type=gha,scope=db-bootstrap \
            --cache-to type=gha,mode=max,scope=db-bootstrap,ignore-error=true \
            --load \
            .

      - name: Build production ops image
        # 生产 ops 镜像（A-1）：承载 operations profile 的 backup 与 audit-archive
        # 一次性任务，runtime 含 PostgreSQL 18 客户端（pg_dump/pg_restore）且非 root。
        run: |
          docker buildx build \
            --file deploy/docker/ops.Dockerfile \
            --tag inpulse/ops:ci \
            --cache-from type=gha,scope=ops \
            --cache-to type=gha,mode=max,scope=ops,ignore-error=true \
            --load \
            .

      - name: Scan production API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "inpulse/api:ci"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"
          format: "table"

      - name: Scan production migration image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "inpulse/migrate:ci"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"
          format: "table"

      - name: Scan production web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "inpulse/web:ci"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"
          format: "table"

      - name: Scan production db-bootstrap image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "inpulse/db-bootstrap:ci"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"
          format: "table"

      - name: Scan production ops image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "inpulse/ops:ci"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: "true"
          format: "table"

      - name: Cache Playwright browsers
        # Chromium 约 100MB，实测安装耗时在 25s~116s 之间波动；缓存命中后
        # `playwright install` 只安装系统依赖并跳过已存在的浏览器。
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @inpulse/e2e exec playwright install --with-deps chromium

      - name: Browser E2E
        env:
          E2E_DATABASE_URL: postgresql://cluster_bootstrap@127.0.0.1:5432/app
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Deploy compose and image ref positive preflight
        # 使用合成 ref 验证 compose 可渲染、所有服务 image 均为 exact-tag@sha256，
        # 以及技术设计 §11.2 的结构不变量；合成 ref 不代表真实镜像已构建。
        run: pnpm check:deploy:test

      - name: Deploy image ref negative preflight
        # 正例由上一步执行；这里单独验证 .example 的占位符必须被拒绝，避免用
        # “脚本存在”冒充真实发布 ref 已绑定。
        run: |
          if node scripts/check_deploy_refs.mjs --env deploy/.env.deploy.example; then
            echo "Expected placeholder *_IMAGE_REF to be rejected by preflight." >&2
            exit 1
          fi
          echo "Preflight correctly rejects placeholder image refs."

      - name: Dependency boundary check
        run: pnpm check:deps

      - name: Frontend boundary check
        run: pnpm check:frontend:boundaries

      - name: Permission matrix check
        run: pnpm permissions:check

      - name: Dependency audit
        run: pnpm deps:audit

      - name: Secret scan
        run: pnpm check:secrets

      - name: Documentation checks
        run: pnpm check:docs

      - name: Stop PostgreSQL test cluster
        if: always()
        run: docker rm --force "$POSTGRES_CONTAINER" || true
