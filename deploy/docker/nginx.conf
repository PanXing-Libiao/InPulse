# 生产 Nginx 配置（技术设计 v1.2.2 §7.5 / §11.1 / §11.2 / §11.3）。
# nginx-unprivileged 监听 8080（HTTP）与 8443（HTTPS），宿主机映射 80/443。
# 仅信任内部代理（API 的 trusted-proxy 只信任本镜像网内的 Nginx），
# HTTP 对 ACME challenge 与健康检查之外返回 308 到 HTTPS。
# API 与 PostgreSQL 不对公网暴露。
#
# HTML 入口逐响应 nonce CSP：Vite 构建产物（apps/web/tools/vite-csp.ts 的
# __INPULSE_CSP_NONCE__ 占位符）由 sub_filter 替换为 $request_id —— nginx 为每个
# 请求生成的 16 随机字节（128 bit，1.11.0+），同一请求内与 CSP 头使用同一值。
# 禁止 unsafe-inline；阶段 0 已在 E2E 验证 Ant Design cssinjs 兼容性（ADR-021）。
#
# 审计请求元数据（ADR-008）：/api/v1 代理注入 X-Request-Id 供 API 记录
# client_request_id。客户端（前端注入）自带符合 API 白名单的值时透传，未提供
# 或格式不合法时回退为 $request_id（每请求 16 随机字节 hex）。map 内的正则必须
# 与 apps/api/src/audit/request-audit-context.ts 的 CLIENT_REQUEST_ID_PATTERN
# 一致（由 scripts/check_deploy_refs.mjs 静态校验）。
map $http_x_request_id $inpulse_audit_request_id {
    default                      $request_id;
    "~^[A-Za-z0-9._:-]{1,64}$"   $http_x_request_id;
}

# 只接受公司主域及其一级子域。未知 Host 在 server 层直接返回 421，HTTP
# 跳转也只使用白名单内的 $host，避免把攻击者控制的 Host 拼进 Location。
map $host $inpulse_https_origin {
    default                                                         "";
    "libiaorobot.com"                                               "https://libiaorobot.com";
    "~^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.libiaorobot\.com$"   "https://$host";
}

server_tokens off;

server {
    listen 8080;
    server_name _;

    if ($inpulse_https_origin = "") {
        return 421;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /health/live {
        proxy_pass http://api:3000/api/v1/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }

    location = /health/ready {
        proxy_pass http://api:3000/api/v1/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }

    location / {
        return 308 $inpulse_https_origin$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/inpulse-security-headers.conf;

    if ($inpulse_https_origin = "") {
        return 421;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # SPA 兜底不能把 .git/.env 等隐藏路径伪装成 200。
    location ~ ^/\. {
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # 明确阻断部署与工具文件，避免扫描器把 SPA 的 200 误判为文件泄露。
    location ~* ^/(?:compose\.ya?ml|secrets(?:/|$)|api/openapi(?:\.json)?$|robots\.txt$) {
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # 带哈希静态资源：内容寻址，可长期缓存。
    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # HTML 入口：占位符同时出现在 meta 与 script/style 标签，必须全部替换。
    location = /index.html {
        root /usr/share/nginx/html;
        sub_filter "__INPULSE_CSP_NONCE__" "$request_id";
        sub_filter_once off;
        # 入口 HTML 随 nonce 变化：关闭条件请求与 ETag，避免 304 复用旧 nonce。
        etag off;
        if_modified_since off;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; script-src-attr 'none'; style-src 'self' 'nonce-$request_id'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 审计「客户端请求 ID」：网关侧保证该头总是存在（浏览器不会自动发送）。
        proxy_set_header X-Request-Id $inpulse_audit_request_id;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /health/live {
        proxy_pass http://api:3000/api/v1/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /health/ready {
        proxy_pass http://api:3000/api/v1/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/inpulse-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/inpulse-security-headers.conf;
    }
}
