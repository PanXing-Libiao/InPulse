# 生产稳态 Compose 拓扑（对齐技术设计 v1.2.2 §11.2）。
#
# 本期范围：稳态拓扑结构、镜像 ref 格式、Secrets/挂载/健康检查声明；已具备
# 生产 API/Web/Migration/DB-bootstrap/Ops 五类镜像（deploy/docker/*.Dockerfile，
# Ops 镜像同时承载 operations profile 的 backup 与 audit-archive），以及
# operations profile 下的 backup 备份服务（F-10.3：pg_dump + AEAD 加密 + 签名
# 清单 + 异机上传，默认命令 `node dist/backup-cli.js backup`）与 audit-archive
# 审计归档服务（F-08 步骤 6：每小时签名链头检查点 + 每日加密明细导出）。
# OPS_IMAGE_REF 由发布清单解析后才可用。operations 服务与宿主调度是生产上线
# 门禁项，上线时才启用，上线前不部署、不运行。宿主调度配置与启用流程已交付在
# deploy/backup/（backupctl.sh、audit-archivectl.sh、systemd 单元与非敏感配置
# 示例）；启用与恢复见 docs/runbooks/backup-restore.md 与
# docs/runbooks/audit-archive.md，升级与回滚见 docs/runbooks/upgrade-rollback.md；
# 静态校验由 pnpm check:deploy 执行。
#
# 说明：
#   1. *_IMAGE_REF 必须由受信镜像仓库解析后写入签名发布清单；本文件只引用
#      变量，不伪造 digest。发布前用 `pnpm check:deploy --env <file>` 校验；
#      CI 用 deploy/.env.deploy.test 做格式与结构正例，用 .example 做拒绝占位符负例。
#   2. 环境变量名按当前代码实际读取为准：
#        - migrate 读 MIGRATION_DB_PASSWORD_FILE / MIGRATION_DB_USER
#        - api 读 RUNTIME_DB_PASSWORD_FILE / DB_USER
#        - audit-archive 读 DB_PASSWORD_FILE（角色 audit_archive_writer）、
#          WORM_CREDENTIALS_FILE 与 ARCHIVE_SIGNING_KEY_FILE，不挂载在线审计 HMAC
#        - backup 读 DB_PASSWORD_FILE（角色 app_backup）、BACKUP_ENCRYPTION_KEY_FILE、
#          OFFSITE_CREDENTIALS_FILE，以及发布清单注入的 BACKUP_GIT_SHA / BACKUP_IMAGE_REF
#        - api 的 ADR-067 AI 辅助转换读 AI_ASSIST_*（默认关闭；启用时密钥只经
#          /run/secrets/ai_assist_api_key，禁用时该文件用空占位即可）
#        - api 的 ADR-068 管理员在线配置另读 AI_ASSIST_ENCRYPTION_KEY_FILE /
#          AI_ASSIST_ENCRYPTION_KEY_VERSION（加密落库密钥用主密钥）；只在需要
#          加密或解密已存密钥时读取，未启用时可放空占位文件但文件须存在
#      技术设计 §11.2 的泛化 `DB_PASSWORD_FILE` 与代码命名仍未统一，属于生产前
#      人工定案项；本拓扑按当前代码落地，不静默改写设计或代码。
#   3. /health/live 与 /health/ready 已实现，应用全局前缀为 /api/v1；
#      API 生产镜像内置 healthcheck.mjs，Web 生产镜像内置 Nginx 配置与 curl。
#   4. AUDIT_DB_*（独立 audit_reader 连接）已由代码读取，本次挂载对应 Secret。
#   5. operations profile 的 backup / audit-archive 服务只在校验过的宿主调度
#      （或人工运维）下按需 `run --rm` 执行，不常驻；上线前
#      `--profile operations` 保持未启用。
#   6. 首次建库与角色/密码初始化由 database/bootstrap 镜像脚本与一次性覆盖
#      deploy/compose.init.yaml 负责（静态校验见 scripts/check_deploy_refs.mjs，
#      完整步骤见 docs/runbooks/disaster-recovery.md）；本文件不为生产准备
#      登录密码；生产不得暴露 PostgreSQL/API 到公网。
#   7. api 只接入 internal 的 backend 网络，唯一入站来源是 web(Nginx)，因此该
#      网络固定静态子网，api 的 TRUSTED_PROXY_CIDRS 与之绑定（Express trust
#      proxy）。二者缺一或漂移都会让 req.ip 退化为 Nginx 容器地址——审计
#      ip_address 与登录/SSO 的 IP 限流全部失真，且本地 loopback 环境不可复现。
#      一致性由 scripts/check_deploy_refs.mjs 静态校验。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: "${DB_IMAGE_REF}"
    user: postgres
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - pg_data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_runtime -d app"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  migrate:
    image: "${MIGRATE_IMAGE_REF}"
    user: "10001:10001"
    command: ["node", "dist/src/migrate.js"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      MIGRATION_DB_USER: app_migrator
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_SSLMODE: "${DB_SSLMODE:-require}"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - source: db_migrator_password
        target: /run/secrets/db_migrator_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    restart: "no"
    logging: *default-logging

  api:
    image: "${API_IMAGE_REF}"
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: app_runtime
      RUNTIME_DB_PASSWORD_FILE: /run/secrets/db_runtime_password
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      # F-08 原始审计读取使用独立 audit_reader 只读连接；主机/端口/库名复用
      # DB_HOST/DB_PORT/DB_NAME，连接池在第一次审计读取时惰性建立。
      AUDIT_DB_USER: audit_reader
      AUDIT_DB_PASSWORD_FILE: /run/secrets/db_audit_reader_password
      SESSION_HASH_KEY_VERSION: "${SESSION_HASH_KEY_VERSION}"
      SESSION_HASH_KEYRING_FILE: /run/secrets/session_hash_keyring
      IDEMPOTENCY_FINGERPRINT_KEY_VERSION: "${IDEMPOTENCY_FINGERPRINT_KEY_VERSION}"
      IDEMPOTENCY_FINGERPRINT_KEYRING_FILE: /run/secrets/idempotency_fingerprint_keyring
      AUDIT_HMAC_KEY_VERSION: "${AUDIT_HMAC_KEY_VERSION}"
      AUDIT_HMAC_KEYRING_FILE: /run/secrets/audit_hmac_keyring
      # ADR-032 立镖 Casdoor OIDC 单点登录；SSO_ENABLED 非真值即整体关闭，
      # Client Secret 只经 Secret 文件提供，禁止环境变量兜底。
      SSO_ENABLED: "${SSO_ENABLED}"
      SSO_ISSUER: "${SSO_ISSUER}"
      SSO_CLIENT_ID: "${SSO_CLIENT_ID}"
      SSO_CLIENT_SECRET_FILE: /run/secrets/sso_client_secret
      SSO_REDIRECT_URI: "${SSO_REDIRECT_URI}"
      # 本地会话空闲有效期（秒），ADR-038 起默认 7200；口令与 SSO 两条签发路径共用。
      SESSION_IDLE_MAX_AGE_SECONDS: "${SESSION_IDLE_MAX_AGE_SECONDS}"
      # 反向代理信任链：api 接入 internal 的 backend（入站唯一来源是 web(Nginx)）
      # 与仅出站的 egress（ADR-074）。TRUSTED_PROXY_CIDRS 必须与 backend 的静态
      # 子网一致，否则 Express 只信任回环地址，req.ip 会退化为 Nginx 容器地址
      # （审计 ip_address、登录/SSO 的 IP 限流全部失真）；非法值会使 API 启动
      # 失败（apps/api/src/trusted-proxy.ts fail closed）。与本文件
      # networks.backend 的 ipam 子网保持一致。
      TRUSTED_PROXY_CIDRS: "172.30.0.0/24"
      # ADR-067 AI 辅助转换：默认关闭（AI_ASSIST_ENABLED 非真值即整体关闭）。
      # 启用时密钥只经 Secret 文件提供（/run/secrets/ai_assist_api_key 只读挂载），
      # 禁止环境变量兜底；禁用时该 Secret 文件可以是空占位（配置加载器只在
      # 启用时读取），但 Compose 仍要求文件存在才能启动 api 容器。
      AI_ASSIST_ENABLED: "${AI_ASSIST_ENABLED:-0}"
      AI_ASSIST_ENDPOINT: "${AI_ASSIST_ENDPOINT:-}"
      AI_ASSIST_MODEL: "${AI_ASSIST_MODEL:-}"
      AI_ASSIST_TIMEOUT_MS: "${AI_ASSIST_TIMEOUT_MS:-60000}"
      AI_ASSIST_MAX_TOKENS: "${AI_ASSIST_MAX_TOKENS:-8192}"
      AI_ASSIST_API_KEY_FILE: /run/secrets/ai_assist_api_key
      # ADR-068 管理员在线配置的主密钥（AES-256-GCM 信封加密）：只从 Secret
      # 文件读取，禁止任何环境变量或明文兜底；未启用在线配置时可放空占位。
      AI_ASSIST_ENCRYPTION_KEY_FILE: /run/secrets/ai_assist_encryption_key
      AI_ASSIST_ENCRYPTION_KEY_VERSION: "${AI_ASSIST_ENCRYPTION_KEY_VERSION:-1}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    secrets:
      - source: db_runtime_password
        target: /run/secrets/db_runtime_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: session_hash_keyring
        target: /run/secrets/session_hash_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: idempotency_fingerprint_keyring
        target: /run/secrets/idempotency_fingerprint_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: audit_hmac_keyring
        target: /run/secrets/audit_hmac_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: sso_client_secret
        target: /run/secrets/sso_client_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: db_audit_reader_password
        target: /run/secrets/db_audit_reader_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: ai_assist_api_key
        target: /run/secrets/ai_assist_api_key
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: ai_assist_encryption_key
        target: /run/secrets/ai_assist_encryption_key
        uid: "10001"
        gid: "10001"
        mode: "0400"
    networks: [backend, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.5"
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      # 依赖 /health/live 与 /health/ready 契约（见文件顶部冲突说明 3），
      # app 镜像需内置 healthcheck.mjs。
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  web:
    image: "${WEB_IMAGE_REF}"
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /var/cache/nginx:size=32m,nosuid,nodev
      - /var/run:size=8m,nosuid,nodev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      TLS_CERT_FILE: /run/secrets/tls_cert
      TLS_KEY_FILE: /run/secrets/tls_key
    secrets:
      - source: tls_cert
        target: /run/secrets/tls_cert
        uid: "101"
        gid: "101"
        mode: "0400"
      - source: tls_key
        target: /run/secrets/tls_key
        uid: "101"
        gid: "101"
        mode: "0400"
    networks: [edge, backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # Web 生产镜像内置 curl；/health/live 由 Nginx 代理到 API。
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "Host: libiaorobot.com",
          "-o",
          "/dev/null",
          "http://127.0.0.1:8080/health/live",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backup:
    image: "${OPS_IMAGE_REF}"
    profiles: [operations]
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    # 默认执行一次完整加密逻辑备份；验证/批量解密用
    # `run --rm backup node dist/backup-cli.js verify --file <pkg>` 覆盖命令。
    command: ["node", "dist/backup-cli.js", "backup"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: app_backup
      DB_PASSWORD_FILE: /run/secrets/db_backup_password
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      OFFSITE_CREDENTIALS_FILE: /run/secrets/offsite_credentials
      BACKUP_LOCAL_DIR: /backup
      # 发布清单注入：Git commit SHA（40 hex）与 ops 镜像 ref 进入签名清单；
      # 生产模式缺任一值即 fail closed（见 apps/ops/src/config.ts）。
      BACKUP_GIT_SHA: "${BACKUP_GIT_SHA:-}"
      BACKUP_IMAGE_REF: "${OPS_IMAGE_REF}"
    secrets:
      - source: db_backup_password
        target: /run/secrets/db_backup_password
        uid: "10002"
        gid: "10002"
        mode: "0400"
      - source: backup_encryption_key
        target: /run/secrets/backup_encryption_key
        uid: "10002"
        gid: "10002"
        mode: "0400"
      - source: offsite_credentials
        target: /run/secrets/offsite_credentials
        uid: "10002"
        gid: "10002"
        mode: "0400"
    volumes:
      - backup_encrypted:/backup
    networks: [backend, edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    restart: "no"
    logging: *default-logging

  audit-archive:
    image: "${OPS_IMAGE_REF}"
    profiles: [operations]
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # 默认执行每小时检查点；宿主调度以 `run --rm audit-archive <cmd>` 覆盖为
    # checkpoint / export / both（见 deploy/backup/audit-archivectl.sh）。
    command: ["node", "dist/cli.js", "checkpoint"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: audit_archive_writer
      DB_PASSWORD_FILE: /run/secrets/db_audit_archive_password
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      WORM_CREDENTIALS_FILE: /run/secrets/audit_worm_credentials
      ARCHIVE_SIGNING_KEY_FILE: /run/secrets/audit_archive_signing_key
    secrets:
      - source: db_audit_archive_password
        target: /run/secrets/db_audit_archive_password
        uid: "10002"
        gid: "10002"
        mode: "0400"
      - source: audit_worm_credentials
        target: /run/secrets/audit_worm_credentials
        uid: "10002"
        gid: "10002"
        mode: "0400"
      - source: audit_archive_signing_key
        target: /run/secrets/audit_archive_signing_key
        uid: "10002"
        gid: "10002"
        mode: "0400"
    networks: [backend, edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    restart: "no"
    logging: *default-logging

networks:
  backend:
    # 静态子网：api 的 TRUSTED_PROXY_CIDRS 需要可枚举的信任目标，Docker 动态
    # 分配时无法稳定配置信任链。若与本机既有网络冲突，compose up 会显式报
    # "Pool overlaps"；改本值时必须同步 api 的 TRUSTED_PROXY_CIDRS。
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  edge:
  # 仅 api 使用的出站网络（ADR-074）：SSO discovery/token/JWKS 与 AI 辅助外联
  # 需要访问外部 HTTPS 端点。不与 web/backup/audit-archive 共享，保证 web 解析
  # api 只得到 backend 地址，维持 TRUSTED_PROXY_CIDRS=172.30.0.0/24 的信任链语义。
  egress:

volumes:
  pg_data:
  backup_encrypted:

secrets:
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_runtime_password:
    file: ./secrets/db_runtime_password
  db_audit_reader_password:
    file: ./secrets/db_audit_reader_password
  db_audit_archive_password:
    file: ./secrets/db_audit_archive_password
  session_hash_keyring:
    file: ./secrets/session_hash_keyring
  idempotency_fingerprint_keyring:
    file: ./secrets/idempotency_fingerprint_keyring
  audit_hmac_keyring:
    file: ./secrets/audit_hmac_keyring
  sso_client_secret:
    file: ./secrets/sso_client_secret
  # ADR-067：AI 辅助转换密钥（OpenAI 兼容中转站）；未启用时可放空占位文件。
  ai_assist_api_key:
    file: ./secrets/ai_assist_api_key
  # ADR-068：管理员在线配置的主密钥（一行 `version:hex`）；未启用时可放空占位文件。
  ai_assist_encryption_key:
    file: ./secrets/ai_assist_encryption_key
  audit_worm_credentials:
    file: ./secrets/audit_worm_credentials
  audit_archive_signing_key:
    file: ./secrets/audit_archive_signing_key
  tls_cert:
    file: ./secrets/tls_cert.pem
  tls_key:
    file: ./secrets/tls_key.pem
  db_backup_password:
    file: ./secrets/db_backup_password
  backup_encryption_key:
    file: ./secrets/backup_encryption_key
  offsite_credentials:
    file: ./secrets/offsite_credentials
